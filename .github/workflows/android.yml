name: Build Auralis debug APK

concurrency:
  group: auralis-android-build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          printf 'sdk.dir=%s\\n' "$SDK_ROOT" > local.properties
      - name: Restore persistent Android signing key
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/debug.keystore
            ~/.android/auralis-cert.sha256
          key: auralis-android-debug-keystore-v2

      - name: Ensure persistent Android signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "No cached keystore found; generating a persistent signing key."
            rm -f "$HOME/.android/auralis-cert.sha256"
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Using cached Android signing key."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify and pin APK signing certificate
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify "$APK"
          ACTUAL_CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest:' | awk '{print tolower($NF)}')"
          test -n "$ACTUAL_CERT_SHA256"
          mkdir -p "$HOME/.android"
          if [ -f "$HOME/.android/auralis-cert.sha256" ]; then
            EXPECTED_CERT_SHA256="$(cat "$HOME/.android/auralis-cert.sha256")"
            echo "Cached signing certificate: $EXPECTED_CERT_SHA256"
            test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          else
            echo "$ACTUAL_CERT_SHA256" > "$HOME/.android/auralis-cert.sha256"
            echo "Created persistent signing certificate: $ACTUAL_CERT_SHA256"
          fi

      - name: Prepare versioned release APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Auralis-0.2.${GITHUB_RUN_NUMBER}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Auralis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Auralis v0.2.${{ github.run_number }}
          body: |
            Автоматическая сборка Auralis для Android.

            Установочный APK прикреплён к этому релизу.
          files: app/build/outputs/apk/debug/Auralis-0.2.${{ github.run_number }}.apk
          generate_release_notes: true
          make_latest: true
