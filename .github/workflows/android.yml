name: Build Auralis debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > local.properties
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK signing certificate
        env:
          EXPECTED_CERT_SHA256: 86abdeb55c6f972157b3ec1a84c0b2d03f362a4ad3bf09653f75a35c2c004cf9
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ACTUAL_CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest:' | awk '{print tolower($NF)}')"
          echo "APK signing certificate: $ACTUAL_CERT_SHA256"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

      - name: Prepare versioned release APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Auralis-0.2.${GITHUB_RUN_NUMBER}.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Auralis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Auralis v0.2.${{ github.run_number }}
          body: |
            Автоматическая сборка Auralis для Android.

            Установочный APK прикреплён к этому релизу.
          files: app/build/outputs/apk/debug/Auralis-0.2.${{ github.run_number }}.apk
          generate_release_notes: true
          make_latest: true
